<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Books Temple Nepal</title>
    <style>
      :root { --bg:#FAF7F2; --text:#1C1C1C; --accent:#2D5A3D; --muted:#8C7B6B; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--text); padding: 24px;
        font-family: Georgia, "Times New Roman", serif; text-align: center;
      }
      .wrap { max-width: 420px; }
      .mark { font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em; }
      .mark span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.3em; color: var(--muted); }
      h1 { font-size: 28px; margin: 24px 0 8px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
      button {
        font: inherit; cursor: pointer; border: 0; border-radius: 8px;
        background: var(--accent); color: #fff; padding: 12px 24px;
        text-transform: uppercase; letter-spacing: 0.05em; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">Books Temple <span>Nepal</span></div>
      <h1>You&rsquo;re offline</h1>
      <p>Looks like the connection dropped. Check your internet and try again — your cart and wishlist are saved.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
